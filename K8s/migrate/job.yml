apiVersion: batch/v1
kind: Job

metadata:
  name: challenge-migrate

spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app: challenge-migrate

    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          command:
            - sh
            - -c
            - >
              until pg_isready
              -h postgres
              -p 5432
              -U "$POSTGRES_USER"
              -d "$POSTGRES_DB";
              do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done

          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: POSTGRES_DB

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"

            limits:
              cpu: "100m"
              memory: "64Mi"

      containers:
        - name: migrate
          image: omarsa999/challenge-backend:latest
          imagePullPolicy: Always

          command:
            - uv
            - run
            - alembic
            - upgrade
            - head

          env:
            # -------------------------
            # PostgreSQL configuration
            # -------------------------
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: POSTGRES_PASS

            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASS)@postgres:5432/$(POSTGRES_DB)"

            # -------------------------
            # Application configuration
            # -------------------------
            - name: ALLOW_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: ALLOW_ORIGINS

            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: API_PREFIX

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: SECRET_KEY

            # -------------------------
            # Google / ImageKit
            # -------------------------
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: GOOGLE_API_KEY

            - name: IMAGEKIT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: IMAGEKIT_PRIVATE_KEY

            # -------------------------
            # RabbitMQ
            # -------------------------
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: RABBITMQ_PASS

            - name: BROKER_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672//"

            # -------------------------
            # Mailtrap
            # -------------------------
            - name: MAILTRAP_HOST
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: MAILTRAP_HOST

            - name: MAILTRAP_PORT
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: MAILTRAP_PORT

            - name: MAILTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: MAILTRAP_USERNAME

            - name: MAILTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secret
                  key: MAILTRAP_PASSWORD

            - name: MAILTRAP_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: MAILTRAP_FROM_EMAIL

            - name: MAILTRAP_FROM_NAME
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: MAILTRAP_FROM_NAME

            - name: MAILTRAP_TO_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: challenge-app-config
                  key: MAILTRAP_TO_EMAIL

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"